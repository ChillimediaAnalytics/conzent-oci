name: chilli-conzent
x-php: &php
  image: chilli-conzent-app:${RELEASE:-pilot}
  build:
    context: ../..
    dockerfile: docker/php/Dockerfile
    target: prod
  env_file: .env
  volumes:
    - public:/var/www/html/public
    - sites:/var/www/html/public/sites_data
    - backups:/var/www/html/backups
    - var:/var/www/html/var
    - ./php-pilot.ini:/usr/local/etc/php/conf.d/zz-pilot.ini:ro
    - ./fpm-pilot.conf:/usr/local/etc/php-fpm.d/zz-pilot.conf:ro
  depends_on:
    mariadb: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: 5m, max-file: '3'}
services:
  app:
    <<: *php
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: [CMD-SHELL, 'php-fpm-healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *php
    command: [php, bin/oci, 'queue:work']
    mem_limit: 256m
    cpus: 0.5
  scheduler:
    <<: *php
    command: [php, bin/oci, 'schedule:run']
    mem_limit: 192m
    cpus: 0.25
  beacon-worker:
    <<: *php
    command: [php, bin/oci, 'ingest:flush']
    mem_limit: 128m
    cpus: 0.25
  nginx:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:3091:80']
    volumes:
      - ./nginx-internal.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      - sites:/var/www/html/public/sites_data:ro
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    logging: *logging
  scanner:
    image: chilli-conzent-scanner:${RELEASE:-pilot}
    build:
      context: ../../docker/scanner
    environment:
      NODE_ENV: production
      PORT: '8300'
      SCANNER_API_KEY: ${SCANNER_API_KEY}
      SCANNER_CALLBACK_KEY: ${SCANNER_WEBHOOK_SECRET}
      SCANNER_BLOCKED_HOSTS: ${SCANNER_BLOCKED_HOSTS}
      MAX_CONCURRENT: '1'
      SCAN_TIMEOUT: '60000'
      SCANNER_CALLBACK_ALLOWED_URLS: http://nginx/api/v1/scan-webhook
    shm_size: 256m
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8300/health]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    logging: *logging
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: conzent
      MARIADB_USER: conzent
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: [--innodb-buffer-pool-size=128M, --max-connections=40, --performance-schema=OFF]
    volumes: ['database:/var/lib/mysql']
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes: ['redis:/data']
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
volumes:
  public:
  sites:
  backups:
  var:
  database:
  redis:
